<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AI Venture Lab: From Prompt to Profit | LSE AI Society</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#070B1F;--bg2:#0C1230;--surf:rgba(255,255,255,.045);--surf2:rgba(255,255,255,.08);--line:rgba(255,255,255,.11);--line2:rgba(255,255,255,.2);--tx:#F4F6FF;--mut:#AAB2D0;--pur:#8B6CFF;--pur2:#6D4DF2;--teal:#2DD4BF;--teal2:#5EEAD4;--amb:#FBBF24;--red:#FB7185;--grn:#4ADE80;--r:16px;--hd:'Bricolage Grotesque','Hanken Grotesk',system-ui,sans-serif;--bd:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px);background:var(--bg)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;font-family:var(--bd);font-size:16px;line-height:1.55;color:var(--tx);min-height:100vh;-webkit-font-smoothing:antialiased;background:radial-gradient(900px 520px at 88% -8%,rgba(139,108,255,.24),transparent 62%),radial-gradient(760px 520px at -8% 18%,rgba(45,212,191,.13),transparent 62%),var(--bg)}
h1,h2,h3,h4{font-family:var(--hd);letter-spacing:-.02em;line-height:1.08;margin:0}
h1{font-size:clamp(2.7rem,6.4vw,5.2rem);font-weight:700}
h2{font-size:clamp(1.8rem,3.6vw,2.7rem);font-weight:700}
h3{font-size:1.2rem;font-weight:600;line-height:1.2}
h4{font-size:1rem;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.lead{font-size:clamp(1.05rem,1.8vw,1.3rem);color:var(--mut);max-width:60ch;margin-top:14px}
.hint{color:var(--mut);font-size:.9rem}
.mut{color:var(--mut)}
.tn{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(7,11,31,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding:10px 20px;max-width:1320px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--hd);font-weight:700;font-size:1.05rem;white-space:nowrap;background:none;border:0;cursor:pointer;padding:0}
.brand small{display:block;font-family:var(--bd);font-weight:500;font-size:.72rem;color:var(--mut)}
.steps{display:flex;gap:4px;list-style:none;margin:0 auto;padding:0;align-items:center}
.step{display:flex;align-items:center;gap:8px;background:none;border:1px solid transparent;border-radius:10px;padding:6px 10px;color:var(--mut);cursor:pointer;min-height:40px;white-space:nowrap}
.step .n{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;border:1px solid var(--line2);font-size:.8rem;font-weight:700}
.step.done{color:var(--tx)}.step.done .n{background:var(--teal);border-color:var(--teal);color:#04141A}
.step.cur{color:var(--tx);background:var(--surf2);border-color:var(--line2)}.step.cur .n{background:var(--pur);border-color:var(--pur);color:#fff}
.step:disabled{opacity:.4;cursor:not-allowed}
.step.vote{margin-left:8px;border-style:dashed;border-color:var(--line2)}
.bar{height:3px;background:var(--line);position:relative}.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--pur),var(--teal));transition:width .5s}
.right{display:flex;align-items:center;gap:10px;margin-left:auto}
.timer{display:flex;flex-direction:column;align-items:flex-end;line-height:1.1;padding:6px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);min-width:92px}
.timer b{font-family:var(--hd);font-size:1.35rem;font-variant-numeric:tabular-nums}.timer span{font-size:.72rem;color:var(--mut)}
.timer.warn b{color:var(--amb)}.timer.zero{border-color:var(--red)}.timer.zero b{color:var(--red);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--surf2);padding:10px 18px;border-radius:12px;font-weight:600;cursor:pointer;transition:border-color .18s,transform .18s,background .18s;min-height:44px;text-decoration:none}
.btn:hover{border-color:var(--teal);transform:translateY(-1px)}
.btn.pri{background:linear-gradient(135deg,#7C5CFF,#5B3FE0);border-color:transparent;box-shadow:0 10px 30px -12px rgba(124,92,255,.9)}
.btn.acc{background:var(--teal);color:#04141A;border-color:transparent}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.9rem;border-radius:10px}
.btn.big{min-height:52px;padding:12px 26px;font-size:1.05rem}
.btn.danger{border-color:rgba(251,113,133,.55);color:#FFB8C3}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.lb{display:block;font-weight:600;margin-bottom:6px}
.inp{width:100%;background:rgba(5,8,24,.62);border:1px solid var(--line2);border-radius:12px;padding:10px 13px;min-height:44px}
textarea.inp{resize:vertical;min-height:80px;line-height:1.45}
.inp:focus{outline:2px solid var(--teal);outline-offset:1px;border-color:transparent}
.inp[aria-invalid=true]{border-color:var(--red)}
.err{color:#FF9FB0;font-size:.92rem;min-height:1.3em;margin-top:5px}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap}
.seg button{min-width:46px;min-height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surf);cursor:pointer;font-weight:600}
.seg button.on{background:var(--pur);border-color:var(--pur);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;border:1px solid var(--line2);font-size:.82rem;color:var(--mut)}
.chip.hi{color:#FFB8C3;border-color:rgba(251,113,133,.5)}.chip.md{color:#FDE08A;border-color:rgba(251,191,36,.5)}.chip.lo{color:var(--mut)}.chip.ok{color:#9FF0C0;border-color:rgba(74,222,128,.5)}.chip.sim{color:var(--teal2);border-color:rgba(45,212,191,.5)}
.card{background:linear-gradient(180deg,var(--surf2),var(--surf));border:1px solid var(--line);border-radius:var(--r);padding:22px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.card.flat{background:var(--surf)}
.note{border-left:3px solid var(--teal);padding:10px 14px;background:rgba(45,212,191,.07);border-radius:0 10px 10px 0;color:var(--mut);font-size:.94rem}
.note.warn{border-color:var(--amb);background:rgba(251,191,36,.07)}
.sec{padding:40px 0 20px}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.foot{padding:30px 20px 50px;color:var(--mut);font-size:.88rem;text-align:center}
.screen.in{animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* welcome */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:36px;align-items:center;padding-top:44px;padding-bottom:20px}
.start{margin-top:28px;display:grid;gap:18px;max-width:540px}
.viz{padding:20px}.viz .prompt{font-size:.92rem;color:var(--mut);border:1px dashed var(--line2);border-radius:12px;padding:10px 12px;margin-bottom:14px}.viz .prompt b{color:var(--teal2);font-weight:600}
.vstats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}.vstats div{border-top:1px solid var(--line);padding-top:8px}.vstats b{display:block;font-family:var(--hd);font-size:1.3rem}.vstats span{font-size:.8rem;color:var(--mut)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 2.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.how{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding-top:30px;padding-bottom:10px}
.how .card{padding:18px}.how .num{font-family:var(--hd);font-size:1.6rem;color:var(--teal2)}.how h3{margin:8px 0 6px;font-size:1.05rem}.how p{font-size:.92rem;color:var(--mut)}
/* challenges */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ccard{text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;border-radius:var(--r);border:1px solid var(--line);background:linear-gradient(180deg,var(--surf2),var(--surf));padding:20px;transition:border-color .2s,transform .2s,box-shadow .2s;position:relative}
.ccard:hover{transform:translateY(-3px);border-color:var(--line2)}
.ccard[aria-checked=true]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal),0 14px 40px -18px rgba(45,212,191,.6)}
.ccard h3{display:flex;align-items:center;gap:10px}.ccard .dot{width:12px;height:12px;border-radius:50%}
.ccard dl{margin:0;display:grid;gap:8px;font-size:.92rem}.ccard dt{font-weight:600;font-size:.86rem;color:var(--teal2)}.ccard dd{margin:0;color:var(--mut)}
.ccard .tick{position:absolute;right:16px;top:16px;width:24px;height:24px;border-radius:50%;background:var(--teal);color:#04141A;display:none;place-items:center;font-weight:700}
.ccard[aria-checked=true] .tick{display:grid}
.ccard.flash{border-color:var(--pur);box-shadow:0 0 0 1px var(--pur)}
/* build */
.build{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}
.form{display:grid;gap:20px}
.fh{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}.fh .lb{margin:0}
.sugs{display:grid;gap:6px;margin-top:8px}.sugs:empty{display:none}
.sug{text-align:left;background:rgba(139,108,255,.1);border:1px solid rgba(139,108,255,.35);border-radius:10px;padding:8px 12px;cursor:pointer;font-size:.92rem}
.sug:hover{border-color:var(--teal)}
.names{display:flex;flex-wrap:wrap;gap:6px}.names .sug{padding:5px 12px;border-radius:99px}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.mopt{text-align:left;background:var(--surf);border:1px solid var(--line2);border-radius:12px;padding:10px 12px;cursor:pointer;display:grid;gap:2px}
.mopt b{font-size:.95rem}.mopt span{font-size:.8rem;color:var(--mut)}.mopt[aria-checked=true]{border-color:var(--teal);background:rgba(45,212,191,.1)}
.cof{position:sticky;top:calc(env(safe-area-inset-top,0px) + 96px);display:grid;gap:14px}
.cof .sect{display:grid;gap:6px}.cof h4{color:var(--teal2)}
.cof textarea.inp{min-height:60px;background:rgba(5,8,24,.45)}
.loader{display:grid;gap:12px;place-items:center;text-align:center;padding:50px 10px}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid var(--line2);border-top-color:var(--teal);animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
/* model */
.scen{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.sc{text-align:left;cursor:pointer;border:1px solid var(--line);background:var(--surf);border-radius:var(--r);padding:16px;display:grid;gap:6px}
.sc[aria-checked=true]{border-color:var(--pur);box-shadow:0 0 0 1px var(--pur);background:rgba(139,108,255,.1)}
.sc b{font-family:var(--hd);font-size:1.1rem}.sc .as{font-size:.85rem;color:var(--mut)}.sc .res{font-weight:700;font-size:1.05rem}
.mgrid2{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;align-items:start}
.fld{padding:12px 0;border-bottom:1px solid var(--line)}.fld:last-child{border:0}
.fl{display:flex;justify-content:space-between;align-items:center;gap:10px}.fl label{font-weight:600;font-size:.94rem}
.num{width:108px;background:rgba(5,8,24,.62);border:1px solid var(--line2);border-radius:10px;padding:6px 8px;text-align:right;min-height:36px;font-variant-numeric:tabular-nums}
.num:focus{outline:2px solid var(--teal)}
input[type=range]{width:100%;accent-color:var(--teal);margin:8px 0 2px;min-height:24px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}
.kpi{border:1px solid var(--line);background:var(--surf);border-radius:14px;padding:12px 14px}
.kpi span{font-size:.82rem;color:var(--mut);display:block}.kpi b{display:block;font-family:var(--hd);font-size:1.45rem;margin:2px 0;font-variant-numeric:tabular-nums}.kpi small{font-size:.78rem;color:var(--mut)}
.pos{color:var(--teal2)}.neg{color:#FF9FB0}
.chartbox{position:relative}.chartbox svg{width:100%;height:auto;display:block}
.tip{position:absolute;pointer-events:none;background:#0B1230;border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:.82rem;min-width:150px;z-index:5;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.tip b{display:block;margin-bottom:3px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.84rem;color:var(--mut);margin-top:8px}.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.g-t{fill:var(--mut);font-size:11px;font-family:var(--bd)}
.fcards{display:grid;gap:10px;margin-top:16px}
.find{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surf)}
.find h4{margin-bottom:3px}.find p{color:var(--mut);font-size:.93rem}
table{width:100%;border-collapse:collapse;font-size:.88rem;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:7px 10px;border-bottom:1px solid var(--line)}th:first-child,td:first-child{text-align:left}th{color:var(--mut);font-weight:600}
.tscroll{overflow-x:auto}
details>summary{cursor:pointer;font-weight:600;min-height:32px}
/* crisis */
.alert{border:1px solid rgba(251,113,133,.5);background:linear-gradient(180deg,rgba(251,113,133,.12),rgba(251,113,133,.03))}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
.opt{text-align:left;cursor:pointer;border:1px solid var(--line2);background:var(--surf);border-radius:var(--r);padding:18px;display:grid;gap:8px;align-content:start}
.opt[aria-checked=true]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:rgba(45,212,191,.08)}
.opt h3{font-size:1.05rem}.opt p{color:var(--mut);font-size:.93rem}
.cmp td:nth-child(n+2),.cmp th:nth-child(n+2){text-align:right}
.disc{font-family:var(--hd);font-size:clamp(1.3rem,2.6vw,1.9rem);border-left:4px solid var(--pur);padding-left:16px;margin:26px 0 10px}
/* pitch */
.pdoc{display:grid;gap:16px}.pdoc:fullscreen{background:var(--bg);padding:28px;overflow:auto}
.phero{display:flex;gap:28px;align-items:center;flex-wrap:wrap;padding:34px;background:radial-gradient(600px 300px at 100% 0,rgba(139,108,255,.3),transparent 60%),radial-gradient(500px 300px at 0 100%,rgba(45,212,191,.18),transparent 60%),var(--surf);border:1px solid var(--line2);border-radius:20px}
.phero h2{font-size:clamp(2.2rem,5vw,3.8rem)}
.tagin{background:transparent;border:0;border-bottom:1px dashed var(--line2);font-size:clamp(1.1rem,2vw,1.5rem);color:var(--teal2);width:100%;padding:4px 0;font-family:var(--hd)}
.pgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}.s2{grid-column:span 2}.s3{grid-column:span 3}.s6{grid-column:span 6}.s4{grid-column:span 4}
.pgrid .card h3{color:var(--teal2);font-size:1rem;margin-bottom:8px}
.pgrid .card p,.pgrid .card li{color:#DDE2F6}.pgrid ul{margin:0;padding-left:18px;display:grid;gap:4px}
.big-n{font-family:var(--hd);font-size:1.7rem;font-weight:700}
.disclaim{font-size:.9rem;color:var(--mut);border:1px dashed var(--line2);border-radius:12px;padding:12px 16px}
.ask{background:linear-gradient(135deg,rgba(124,92,255,.3),rgba(45,212,191,.16));border-color:var(--line2)}
/* vote */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 18px}.tabs button{border:1px solid var(--line2);background:var(--surf);padding:9px 16px;border-radius:99px;cursor:pointer;font-weight:600;min-height:44px}.tabs button[aria-selected=true]{background:var(--pur);border-color:var(--pur);color:#fff}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:16px}
.crit{display:grid;gap:2px;margin-top:10px}.crit .fl span{font-variant-numeric:tabular-nums;font-weight:700}
.total{font-family:var(--hd);font-size:2rem;font-weight:700}
.rank{display:grid;grid-template-columns:44px auto 1fr auto;gap:14px;align-items:center;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surf);margin-bottom:10px}
.rank .pos-n{font-family:var(--hd);font-size:1.5rem;color:var(--teal2)}
.meter{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--pur),var(--teal))}
.pm{display:inline-flex;align-items:center;gap:6px}.pm button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line2);background:var(--surf);cursor:pointer;font-weight:700}
.winner{text-align:center;display:grid;gap:12px;justify-items:center;padding:10px}
.winner h2{font-size:clamp(2rem,6vw,3.4rem)}
/* overlays */
.drawer{position:fixed;z-index:60;top:0;right:0;bottom:0;width:min(440px,100%);background:#0A1028;border-left:1px solid var(--line2);transform:translateX(102%);transition:transform .3s;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start;visibility:hidden}
.drawer.open{transform:none;visibility:visible}
.drawer h3{font-size:1rem;color:var(--teal2);margin-bottom:8px}
.drawer section{border-top:1px solid var(--line);padding-top:14px}
.dtime{font-family:var(--hd);font-size:2.6rem;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;z-index:80;background:rgba(3,5,16,.72);display:grid;place-items:center;padding:20px;backdrop-filter:blur(4px)}
.modal{background:#0B1230;border:1px solid var(--line2);border-radius:18px;padding:26px;max-width:520px;width:100%;display:grid;gap:14px;max-height:90vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:#10183C;border:1px solid var(--teal);padding:10px 18px;border-radius:12px;z-index:90;transition:.3s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{position:fixed;z-index:50;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(900px,calc(100% - 28px));background:linear-gradient(135deg,#2A1B73,#0B2F3A);border:1px solid var(--line2);border-radius:18px;padding:18px 22px;display:flex;gap:16px;align-items:center;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.banner p{font-family:var(--hd);font-size:clamp(1.1rem,2.4vw,1.7rem);flex:1;line-height:1.2}
[hidden]{display:none!important}
@media (max-width:1000px){.hero,.build,.mgrid2{grid-template-columns:1fr}.cof{position:static}.cgrid{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:repeat(2,1fr)}.how{grid-template-columns:1fr 1fr}.opts{grid-template-columns:1fr}.step span.t{display:none}}
@media (max-width:640px){.cgrid,.scen,.two,.how{grid-template-columns:1fr}.pgrid{grid-template-columns:1fr}.s2,.s3,.s4,.s6{grid-column:auto}.top-in{flex-wrap:wrap;gap:8px;padding:8px 12px}.steps{order:3;width:100%;justify-content:space-between;margin:0}.step{padding:4px 6px}.brand small{display:none}.rank{grid-template-columns:34px 1fr}.rank .meter,.rank .rs{grid-column:1/-1}.find{grid-template-columns:1fr}.wrap{padding:0 14px}.card{padding:16px}.phero{padding:20px}.timer b{font-size:1.1rem}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}.draw{stroke-dashoffset:0}}
@media print{

living:{n:'Student Living',acc:'#8B6CFF',problem:'Rent, food and transport costs are rising faster than maintenance loans, and most students cannot see where their money actually goes.',audience:'Undergraduates and postgraduates in shared housing, including international students managing money in a new city.',opp:'Small, repeated decisions about what to cook, where to shop and how to travel add up quickly. Which of them is the right place for AI to help?',cap:10,alt:'spreadsheets, generic banking apps and group chats',gap:'show what has already been spent but not what to do next',feats:['Weekly plan that adapts to term dates, loan instalments and shared bills','Early-warning alerts before a budget line is overspent','Cheaper-alternative suggestions for food, travel and subscriptions'],risks:['Handling sensitive financial data raises trust and compliance demands.','Students have limited willingness to pay, so churn is a constant threat.'],aiNeed:'Understanding messy transaction data, spotting patterns and writing personalised plans for thousands of different budgets cannot be done with fixed rules.',noAI:'A basic spreadsheet or fixed-category tracker can already show totals, and simple rules can send a reminder when a bill is due.',tags:['Make every pound go further.','Know where your money goes before it goes.','Student life, budgeted.'],
ideas:I([[['PennyNest','Flatmate Ledger'],'unpredictable monthly bills and rising grocery costs','university students living in shared housing','an AI budgeting assistant that turns bank transactions into a weekly plan and flags overspending before it happens','It plans around student life, such as term dates, loan instalments and shared bills, instead of generic monthly budgets','subscription'],[['MealSplit','CampusPantry'],'wasting money on food that is not planned around what students already have','students who cook for themselves on a tight budget','a meal planner that builds cheap weekly menus from the ingredients in the cupboard and local supermarket offers','It optimises for cost per portion and cooking time, not just recipes','freemium'],[['RentRadar','FairShare'],'finding affordable housing and fair bill-splitting in a competitive rental market','first-year and international students looking for housing','an assistant that scores listings for true monthly cost, commute time and landlord risk, then drafts messages to landlords','It shows the true all-in cost, including bills and travel, not just the rent','commission'],[['CommuteCut','TermTrack'],'overspending on transport, subscriptions and small recurring costs','students in expensive cities','a tool that finds duplicate subscriptions, forgotten renewals and cheaper travel options, then handles cancellations','It acts on its findings instead of only reporting them','payperuse']])},
education:{n:'Education',acc:'#2DD4BF',problem:'Lectures and revision materials are one-size-fits-all, so many students only discover what they do not understand in the exam.',audience:'Students in large courses, learners with different accessibility needs, and the teaching staff supporting them.',opp:'Learners differ in pace, background and format. Where could personalisation help without replacing good teaching?',cap:12,alt:'video lectures, search engines and private tutors',gap:'cannot adapt to what a particular student misunderstands',feats:['Gap diagnosis from practice answers','Personalised revision path that updates after every session','Explanations that adjust to the student’s level and preferred format'],risks:['Students and universities may worry about accuracy and academic integrity.','Selling to universities involves long procurement cycles.'],aiNeed:'Explaining the same idea in many ways and responding to free-text answers needs language understanding and adaptive generation.',noAI:'Static question banks, timers and flashcard schedules work without AI, and a human tutor still offers better judgement.',tags:['Learn what you actually need to learn.','A tutor that learns you back.','Study smarter, not longer.'],
ideas:I([[['TutorLoop','Socratic Lab'],'one-size-fits-all lectures that leave students unsure what they do not understand','first and second-year undergraduates in quantitative courses','an AI study partner that diagnoses gaps from past answers and builds a personal revision path','It guides students towards answers with questions instead of giving the answer away','subscription'],[['LectureLens','NoteBridge'],'lecture recordings and notes that are too long or inaccessible for students with different needs','students with dyslexia, ADHD or English as a second language','a tool that turns lecture recordings into structured summaries, glossaries and audio in the student’s preferred format','It is designed around accessibility needs first, not added afterwards','b2b'],[['ExamEcho','PaperTrail'],'a lack of timely, specific feedback on essays and problem sets','students and teaching assistants in large courses','a feedback engine that gives teaching assistants draft comments against the marking rubric, which they edit and approve','A human always approves the feedback, which protects academic standards','b2b'],[['SkillSprint','LinguaLoop'],'language and skills courses that are not adapted to individual pace','adult learners and students preparing to study abroad','an adaptive practice app that sets a daily ten-minute session based on what the learner is about to forget','It schedules practice around the learner’s timetable and exam dates','freemium']])},
finance:{n:'Financial Literacy',acc:'#FBBF24',problem:'Young people make big money decisions about loans, credit and saving before anyone has explained how they work.',audience:'Students and recent graduates in their first years of managing their own money.',opp:'Financial products are confusing and the loudest advice online is often selling something. What would trustworthy help look like?',cap:8,alt:'social media advice, comparison websites and parents',gap:'are either generic, biased by commissions or too technical to follow',feats:['Plain-English explanations using the user’s own numbers','Scenario simulations for loans, savings and income','Alerts for fees, scams and high-cost products'],risks:['Financial guidance is regulated, so the product must educate rather than advise.','Incorrect output could cause real harm, so trust and human review are crucial.'],aiNeed:'Turning complex products into personalised explanations and answering follow-up questions needs conversational AI.',noAI:'Calculators and fixed guides can already model loan repayments and compound interest. AI adds personalisation, not the maths.',tags:['Money explained, in plain English.','Good money habits start early.','Decide with confidence.'],

ideas:I([[['LeftoverLoop','FridgeFriend'],'good food thrown away because households forget what they have','households and student flats','a fridge-scanning assistant that tracks expiry dates and suggests recipes before food goes off','It needs one photo, not manual data entry','freemium'],[['SurplusBridge','ShelfSave'],'cafés and shops binning unsold food at closing time','independent cafés, bakeries and grocers','a demand-forecasting tool that predicts daily surplus and sells it to nearby customers at a discount','It forecasts per product and per day, so businesses also prepare less in the first place','commission'],[['SecondSpin','ReWear'],'unnecessary purchases of items that could be borrowed, rented or bought second-hand','students who move often and own little','a campus marketplace assistant that matches requests with nearby items and suggests when borrowing is cheaper than buying','It focuses on short-term needs and trusted campus networks','commission'],[['CarbonCart','GreenBasket'],'shoppers who want to buy sustainably but cannot compare products quickly','environmentally conscious young shoppers','a basket analyser that scores groceries for waste and emissions and suggests lower-impact swaps at a similar price','It recommends swaps that are affordable, so sustainability does not cost more','subscription']])},
careers:{n:'Careers',acc:'#F472B6',problem:'Graduates compete for the same roles with similar CVs, and talented students struggle to show evidence of what they can do.',audience:'Students applying for internships and graduate roles, and the employers trying to find them.',opp:'Employers want evidence, students have it scattered across coursework and societies. What would connect the two?',cap:12,alt:'CVs, job boards and generic advice',gap:'do not show how a student’s evidence matches a specific role',feats:['Skills extraction from coursework and projects','Role matching with explanations of the gaps','Tailored application drafts and interview practice'],risks:['Bias in matching could disadvantage some applicants.','Employers, not students, usually hold the budget.'],aiNeed:'Reading unstructured text such as projects, CVs and job descriptions, and generating tailored feedback, requires language models.',noAI:'Keyword filters and templates can sort applications and structure CVs, but they miss context and transferable skills.',tags:['Show what you can do.','Evidence beats adjectives.','From coursework to career.'],

smb:{n:'Small Businesses',acc:'#38BDF8',problem:'Large companies use data and automation to win customers while small businesses spend their evenings on admin.',audience:'Independent shops, cafés, salons and sole traders with one to ten staff and very little spare time.',opp:'Small teams cannot afford specialists. Which everyday jobs could software do well enough to give the owner their time back?',cap:60,alt:'manual admin, large-platform tools and expensive agencies',gap:'are built for large firms and are too complex or costly for a team of three',feats:['Set-up from the existing website, invoices and sales data','Drafts for messages, posts and orders that the owner approves','A weekly summary of what to do next'],risks:['Owners are time-poor, so onboarding must be almost instant.','Large platforms may copy the feature and bundle it for free.'],aiNeed:'Writing in the owner’s voice and forecasting from small, noisy data needs language and predictive models.',noAI:'Scheduling tools, templates and basic reports can already save time. AI lifts the quality and removes the set-up work.',tags:['Big-company tools for small-business hours.','Do more with the team you have.','Your business, on autopilot.'],
ideas:I([[['ShopSage','AutoReply'],'owners spending hours on customer messages and bookings','independent shops, salons and restaurants','a customer-service assistant that answers common questions, takes bookings and hands difficult chats to the owner','It is set up in ten minutes from the business’s own website and FAQs','subscription'],[['StockSight','OrderOracle'],'over- or under-ordering stock because demand is hard to predict','small retailers and cafés','a demand-forecasting assistant that uses sales history, weather and local events to suggest weekly orders','It explains each suggestion in plain English so owners stay in control','subscription'],[['AdSpark','PostPilot'],'marketing that is inconsistent because owners lack time and design skills','one-to-five-person businesses','a marketing assistant that drafts a month of posts, offers and emails in the business’s own voice','It learns the business’s tone from past customer messages and stays on-brand','freemium'],[['BookKeepAI','TaxTidy'],'bookkeeping and invoicing admin that eats up evenings','sole traders and micro-businesses','an assistant that sorts transactions, chases late invoices and prepares simple monthly summaries','It chases payments politely and automatically, which improves cash flow','payperuse']])}

const EV=id=>CRISES.find(c=>c.id===id)||CRISES[0];

/* ============ state ============ */
const KEY='ai-venture-lab-v1';
const SCR=['welcome','challenge','build','model','crisis','pitch','vote'];
const LAB=['Challenge','Startup','Model','Crisis','Pitch'];
const dflt=()=>({screen:'welcome',last:null,reached:0,teamId:null,team:{name:'',size:4},ch:null,idea:{name:'',problem:'',customer:'',solution:'',diff:'',model:'subscription'},concept:null,baseFin:null,fin:null,finModel:null,scen:'base',crisis:{id:null,opt:null,confirmed:false,revealed:false,notes:''},tagline:'',teams:[],host:{duration:600,remaining:600,running:false,endAt:0,fair:null,prompt:null,pIdx:0}});
let state=dflt();
try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);state=Object.assign(dflt(),s);state.host=Object.assign(dflt().host,s.host||{});state.crisis=Object.assign(dflt().crisis,s.crisis||{});state.idea=Object.assign(dflt().idea,s.idea||{});state.team=Object.assign(dflt().team,s.team||{})}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
let st;const saveSoon=()=>{clearTimeout(st);st=setTimeout(save,250)};
const setPath=(p,v)=>{const k=p.split('.');let o=state;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=v};
const curTeam=()=>state.teams.find(t=>t.id===state.teamId);
function syncTeam(){const t=curTeam();if(!t)return;t.name=state.team.name||t.name;t.startup=state.idea.name||'';if(state.fin){const m=metrics(finalFin());t.yr1=m.yr1;t.rev12=m.rev12;t.end=m.endCust}t.tag=state.tagline||'';if(state.crisis.id)t.crisis=EV(state.crisis.id).title}
const newTeam=(name)=>({id:'t'+Date.now()+Math.floor(Math.random()*999),name,startup:'',tag:'',yr1:null,rev12:null,end:null,crisis:'',scores:{p:0,a:0,f:0,x:0},votes:{inn:0,biz:0,ai:0,suc:0}});

/* ============ finance engine ============ */
function project(f,n=12){const rows=[];let c=Math.max(0,+f.customers||0),cum=-(+f.setup||0);const net=((+f.growth||0)-(+f.churn||0))/100;for(let t=1;t<=n;t++){const rev=c*f.price,vc=c*f.varCost,cost=f.opex+vc,profit=rev-cost;cum+=profit;rows.push({t,cust:c,rev,vc,cost,profit,cum});c=Math.max(0,c*(1+net))}return rows}
function metrics(f){
 const rows=project(f,12),long=project(f,36);
 const rev12=rows.reduce((a,r)=>a+r.rev,0),cost12=rows.reduce((a,r)=>a+r.cost,0),op12=rows.reduce((a,r)=>a+r.profit,0);
 const unit=f.price-f.varCost,gm=f.price>0?unit/f.price:null;
 let be=null;if(f.opex<=0&&unit>=0)be=0;else if(unit>0)be=Math.ceil(f.opex/unit);
 const bm=long.find(r=>r.profit>=0&&r.rev>0),beMonth=bm?bm.t:null;
 const trough=Math.min(...rows.map(r=>r.cum));
 return{rows,rev12,cost12,op12,yr1:op12-f.setup,unit,gm,be,beMonth,trough,need:Math.max(0,-trough),endCust:rows[11].cust,m1:rows[0],m12:rows[11],life:f.churn>0?100/f.churn:null,ltv:f.churn>0&&unit>0?unit/(f.churn/100):null}}
function beExplain(f,m){
 if(f.price<=0)return 'You are not charging anything yet, so there is no revenue to cover your costs. Set a price above zero.';
 if(m.unit<=0)return `Break-even is not possible with these assumptions. Each customer costs ${gbp(f.varCost,2)} a month to serve but pays ${gbp(f.price,2)}, so every extra customer adds to the loss. Raise the price or cut variable cost first.`;
 const net=f.growth-f.churn;
 if(f.customers<=0)return 'With no starting customers and nothing to compound, the model cannot grow. Add starting customers to see a break-even point.';
 if(m.be===0)return 'With no operating costs, you cover your costs from the first customer.';
 if(m.m1.profit>=0)return `You already cover monthly costs in month 1. Break-even needs ${num(m.be)} customers and you start with ${num(f.customers)}.`;
 if(m.endCust>=m.be&&m.beMonth&&m.beMonth<=12)return `You need ${num(m.be)} customers to cover monthly costs. In this simulation you reach that in month ${m.beMonth} (${num(m.endCust)} customers by month 12).`;
 if(net<=0)return `You need ${num(m.be)} customers to break even, but growth (${f.growth}%) does not outrun churn (${f.churn}%), so the customer base ${net<0?'shrinks':'stays flat'} at around ${num(m.endCust)}. Raise growth, cut churn or lower fixed costs.`;
 if(m.beMonth)return `You need ${num(m.be)} customers but reach only ${num(m.endCust)} by month 12. At this pace monthly profit turns positive in month ${m.beMonth}, beyond the first year.`;
 return `You need ${num(m.be)} customers but reach only ${num(m.endCust)} by month 12 and do not get there within three years at this growth rate. Net growth is only ${num(net,1)}% a month.`}
function scenFin(base,k){const s=SC[k].m,r=(v,s,step=1)=>Math.round(v*s/step)*step;return{customers:Math.max(base.customers?1:0,r(base.customers,s.customers)),price:r(base.price,s.price,.25),opex:r(base.opex,s.opex,50),varCost:r(base.varCost,s.varCost,.05),setup:r(base.setup,s.setup,100),growth:clamp(r(base.growth,s.growth,.5),0,100),churn:clamp(r(base.churn,s.churn,.5),0,100)}}
function ensureFin(){const mod=state.idea.model;if(!state.fin||state.finModel!==mod){const had=!!state.fin;state.baseFin={...MDEF[mod]};state.fin={...MDEF[mod]};state.finModel=mod;state.scen='base';if(had)toast(`Assumptions reset to sensible defaults for ${MODELS[mod].l}.`)}}
function combine(list){const r=M({});for(const m of list){['c','p','o','v','gm','hm'].forEach(k=>r[k]*=m[k]);['g','h','s','cash','eq'].forEach(k=>r[k]+=m[k])}return r}
function applyMods(f,...list){const m=combine(list);return{fin:{customers:f.customers*m.c,price:f.price*m.p,opex:f.opex*m.o,varCost:f.varCost*m.v,setup:f.setup+m.s,growth:clamp(f.growth*m.gm+m.g,0,100),churn:clamp(f.churn*m.hm+m.h,0,100)},cash:m.cash,eq:m.eq}}
function cctx(){const i=state.idea;return{name:i.name||'your startup',cust:lc(i.customer)||'your customers',model:i.model,ch:CH[state.ch]||CH.living,ai:AISHARE[i.model],fin:state.fin||MDEF[i.model]}}
function crisisResult(){const cr=state.crisis;if(!cr.id||!state.fin)return null;const ev=EV(cr.id),c=cctx(),imp=ev.impact(c),opt=cr.opt!=null?ev.opts[cr.opt]:null,om=opt?opt.m(c):M({});const shock=applyMods(state.fin,imp),resp=applyMods(state.fin,imp,om);return{ev,opt,c,base:state.fin,shock:shock.fin,resp:resp.fin,mBase:metrics(state.fin),mShock:metrics(shock.fin),mResp:metrics(resp.fin),cash:resp.cash,eq:resp.eq}}
function finalFin(){if(state.crisis.confirmed&&state.crisis.opt!=null){const r=crisisResult();if(r)return r.resp}return state.fin||MDEF[state.idea.model]}

/* ============ co-founder engine (local templates) ============
   To connect a real model later, replace generateConcept() with a call to your OWN server
   endpoint (e.g. POST /api/concept) that holds the API key. Never put keys in this file. */
function generateConcept(i,chKey){
 const C=CH[chKey],m=i.model;
 const pitch=`${i.name} helps ${lc(i.customer)} deal with ${lc(i.problem)} using ${lc(i.solution)}, sold through ${MODELS[m].ph}.`;
 const pain=`${cap(i.customer)} are dealing with ${lc(i.problem)}. Today they rely on ${C.alt}, which ${C.gap}. Test it: ask five ${lc(i.customer)} how they handle this today and what it costs them.`;
 const keyed=FEATKEY.filter(([re])=>re.test(i.solution)).map(x=>x[1]).slice(0,2);
 const feats=[...keyed,...C.feats.slice(0,keyed.length?2:3),MFEAT[m]].slice(0,5);
 const adv=`${cap(i.diff)}. Defensibility: ${MOAT[m]}. To make this real, decide which data or relationship only you will have after 12 months.`;
 const risks=[C.risks[0],C.risks[1],MRISK[m]];
 if(low(i.diff).length<30)risks.unshift(`Your stated differentiator is short and may be easy to copy. Sharpen exactly what a larger competitor could not do quickly.`);
 if(/everyone|everybody|anyone|all people|all students|general public/i.test(i.customer))risks.unshift('Your target customer is very broad. Start with one narrow, reachable segment.');
 const why=`${C.aiNeed} For ${i.name}, ${lc(i.solution)} works because it responds to each user’s situation rather than applying one fixed rule.`;
 const without=`${C.noAI} A fair test: build the simplest non-AI version first and see what customers still complain about. That gap is where AI earns its cost.`;
 return{pitch,pain,features:feats.join('\n'),adv,risks:risks.slice(0,4).join('\n'),why,without,sig:sig(i,chKey)}}
const sig=(i,c)=>JSON.stringify([c,i.name,i.problem,i.customer,i.solution,i.diff,i.model]);
function defaultTagline(){const C=CH[state.ch]||CH.living;return C.tags[hash(state.idea.name||'x')%C.tags.length]}

/* ============ critique ============ */
let lastCrit=[];
function critique(){
 const f=state.fin,m=metrics(f),C=CH[state.ch]||CH.living,md=state.idea.model,b2b=md==='b2b',out=[],net=f.growth-f.churn;
 const add=(sev,title,body,fix)=>out.push({sev,title,body,fix});
 const r=(v,s=1)=>Math.round(v/s)*s;
 if(f.customers<=0)add('hi','No customers at launch','With zero starting customers nothing compounds, so revenue stays at zero. Even a handful of design partners gives you something to learn from.',{label:`Set starting customers to ${b2b?5:100}`,patch:{customers:b2b?5:100}});
 if(f.price<=0)add('hi','Nothing is being charged','Without a price there is no revenue. Decide what your customers would genuinely pay.',{label:`Set price to ${gbp(b2b?150:8)}`,patch:{price:b2b?150:8}});
 else if(m.unit<=0)add('hi','Every customer loses you money',`You earn ${gbp(f.price,2)} but spend ${gbp(f.varCost,2)} serving each customer, so growth increases the loss. Check how much AI usage each customer really triggers.`,{label:'Price at 2.5× variable cost',patch:{price:Math.ceil(f.varCost*2.5*2)/2}});
 else if(m.gm<.5)add('md','Thin gross margin',`Your gross margin is ${num(m.gm*100)}%. Software businesses typically aim for 70% or more because fixed costs still have to be paid. AI usage costs can quietly eat margin.`,{label:'Cut variable cost by 20%',patch:{varCost:r(f.varCost*.8,.05)}});
 if(f.growth>25)add('hi','Customer acquisition looks unrealistic',`${f.growth}% growth every month compounds to about ${num(Math.pow(1+net/100,11),1)}× your starting customers in a year. Few startups sustain that without heavy spending that this model does not include.`,{label:'Reduce growth to 12%',patch:{growth:12}});
 else if(f.growth>15)add('md','Ambitious growth rate',`${f.growth}% monthly growth is possible but rarely sustained. Ask where each new customer will actually come from, and what it costs.`,{label:'Reduce growth to 10%',patch:{growth:10}});
 if(!b2b&&f.customers>1000)add('md','Large starting customer base',`Starting with ${num(f.customers)} paying customers on day one is rare. Most startups begin with tens or low hundreds.`,{label:'Set to 250',patch:{customers:250}});
 if(b2b&&f.customers>40)add('md','Many organisations on day one',`Winning ${num(f.customers)} organisational customers at launch is unusual given long sales cycles. Consider how many you can realistically close in month one.`,{label:'Set to 15',patch:{customers:15}});
 if(f.churn>10)add('hi','Churn is very high',`${f.churn}% monthly churn means customers stay about ${num(100/f.churn,1)} months on average. You would be refilling a leaking bucket. Retention is often cheaper to fix than acquisition.`,{label:`Reduce churn to ${Math.max(4,r(f.churn*.6,.5))}%`,patch:{churn:Math.max(4,r(f.churn*.6,.5))}});
 else if(f.churn>6)add('md','Churn deserves attention',`${f.churn}% monthly churn means an average customer lifetime of ${num(100/f.churn,1)} months. Consumer subscriptions often struggle here.`,{label:`Reduce churn to ${r(f.churn*.7,.5)}%`,patch:{churn:r(f.churn*.7,.5)}});
 else if(f.churn<2&&!b2b&&f.churn>=0)add('md','Churn looks optimistic',`Below 2% monthly churn is rare for consumer products. Test this assumption before relying on it.`,{label:'Set churn to 4%',patch:{churn:4}});
 if(f.customers>0&&net<=0)add('hi','Customer base is flat or shrinking',`Growth (${f.growth}%) does not outrun churn (${f.churn}%), so you lose customers over time. Revenue falls even if costs stay the same.`,{label:`Set growth to ${f.churn+3}%`,patch:{growth:Math.min(100,f.churn+3)}});
 const rev1=m.m1.rev;
 if(rev1>0&&f.opex>2.5*rev1&&m.unit>0)add('md','Fixed costs are heavy',`Operating costs of ${gbp(f.opex)} a month are ${num(f.opex/rev1,1)}× your month-1 revenue. A small team can usually run leaner until revenue proves the idea.`,{label:'Cut operating costs by 15%',patch:{opex:r(f.opex*.85,50)}});
 if(!b2b&&f.price>C.cap&&f.price>0)add('md',`Price may be too high for this audience`,`${C.audience.split(',')[0]} are price-sensitive. In ${C.n.toLowerCase()}, prices above about ${gbp(C.cap)} a month often hit resistance.`,{label:`Set price to ${gbp(C.cap)}`,patch:{price:C.cap}});
 if(b2b&&f.price>0&&f.price<50)add('lo','B2B price may be too low','A licence under £50 a month rarely covers the cost of selling to and supporting an organisation.',{label:'Set price to £150',patch:{price:150}});
 if(m.unit>0&&m.be!=null&&m.m1.profit<0&&!(m.beMonth&&m.beMonth<=12))add('md','Break-even falls beyond year one',beExplain(f,m),null);
 if(m.need>0)add('lo','You will need funding',`The cumulative cash balance dips to ${gbp(-m.need)} (including setup costs). Plan how to cover at least that, plus a buffer, through savings, grants, revenue or investment.`,{label:'Cut setup costs by 25%',patch:{setup:r(f.setup*.75,100)}});
 if(m.ltv)add('lo','What a customer is worth',`Each customer is worth about ${gbp(m.ltv)} in gross profit over their lifetime. If winning one costs more than that, every sale loses money.`,null);

function niceScale(min,max,ticks=4){if(max<=min)max=min+1;const raw=(max-min)/ticks,mag=10**Math.floor(Math.log10(raw)),nm=raw/mag,step=(nm<=1?1:nm<=2?2:nm<=5?5:10)*mag;return{lo:Math.floor(min/step)*step,hi:Math.ceil(max/step)*step,step}}
function chartSVG(rows,o={}){
 const W=o.w||720,H=o.h||320,mini=!!o.mini,pl=mini?10:56,pr=14,pt=14,pb=mini?10:30;
 const maxV=Math.max(1,...rows.map(r=>Math.max(r.rev,r.cost))),minV=Math.min(0,...rows.map(r=>r.profit)),sc=niceScale(minV,maxV,4),lo=sc.lo,hi=sc.hi;
 const n=rows.length,x=i=>pl+(W-pl-pr)*(i+.5)/n,y=v=>pt+(H-pt-pb)*(1-(v-lo)/(hi-lo)),bw=Math.min(24,(W-pl-pr)/n*.45);
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Chart of monthly revenue, costs and profit over 12 months. Data is in the table below.">`;
 if(!mini)for(let v=lo;v<=hi+sc.step/2;v+=sc.step){s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(255,255,255,${v===0?.35:.08})" stroke-width="1"/><text class="g-t" x="${pl-8}" y="${y(v)+4}" text-anchor="end">${kfmt(v)}</text>`;if(Math.abs(v)<1e-9&&sc.step<1)break}
 if(!mini)rows.forEach((r,i)=>{s+=`<text class="g-t" x="${x(i)}" y="${H-8}" text-anchor="middle">M${r.t}</text>`});
 if(!mini)rows.forEach((r,i)=>{const y0=y(0),y1=y(r.profit);s+=`<rect x="${x(i)-bw/2}" y="${Math.min(y0,y1)}" width="${bw}" height="${Math.max(1,Math.abs(y1-y0))}" rx="2" fill="${r.profit>=0?'rgba(94,234,212,.28)':'rgba(251,113,133,.4)'}"/>`});
 const path=k=>rows.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r[k]).toFixed(1)}`).join(' ');
 s+=`<path d="${path('rev')} L${x(n-1)},${y(0)} L${x(0)},${y(0)} Z" fill="rgba(45,212,191,.12)"/>`;
 s+=`<path d="${path('cost')}" fill="none" stroke="#8B6CFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" ${mini?'class="draw" pathLength="1"':'stroke-dasharray="6 4"'}/>`;
 s+=`<path d="${path('rev')}" fill="none" stroke="#2DD4BF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" ${mini?'class="draw" pathLength="1"':''}/>`;
 if(!mini)s+=`<g id="hov" hidden><line id="hl" y1="${pt}" y2="${H-pb}" stroke="rgba(255,255,255,.4)"/></g>`;
 return s+'</svg>'}

VIEWS.crisis=()=>{const cr=state.crisis,ev=EV(cr.id),c=cctx();
 if(!cr.revealed)return `<section class="wrap sec"><div class="card alert" style="text-align:center;padding:50px 20px;margin-top:20px"><h2>Crisis Room</h2><p class="lead" style="margin-inline:auto">Your startup is up and running. Something is about to happen to it. Take a breath, then open the briefing.</p><div class="row" style="justify-content:center;margin-top:24px"><button class="btn pri big" data-act="reveal">Open the briefing</button><button class="btn sm" data-act="nav" data-s="model">Back to model</button></div>${state.host.fair?'<p class="hint" style="margin-top:14px">The host has set one crisis for every team.</p>':''}</div></section>`;
 const r=crisisResult(),chosen=cr.opt;
 return `<section class="wrap sec">
 <div class="sec-head"><div><h2>The Crisis Room</h2><p class="lead">${esc(c.name)} has just been hit. There is no perfect answer, only trade-offs.</p></div><span class="chip sim">Simulated event</span></div>
 <div class="card alert"><div class="row" style="margin-bottom:8px"><span class="chip hi">${ev.tag}</span><span class="chip">${'●'.repeat(ev.sev)}${'○'.repeat(3-ev.sev)} severity</span></div>
  <h3 style="font-size:clamp(1.4rem,3vw,2rem)">${esc(ev.title)}</h3><p style="margin-top:10px">${esc(ev.sit(c))}</p>
  <p class="mut" style="margin-top:10px"><b>Business impact:</b> ${esc(ev.imp(c))}</p>
  <div class="vstats"><div><b>${gbp(r.mBase.yr1)}</b><span>year-one result before</span></div><div><b class="${r.mShock.yr1>=0?'pos':'neg'}">${gbp(r.mShock.yr1)}</b><span>year-one result after the shock, if you do nothing</span></div><div><b>${num(r.mShock.endCust)}</b><span>customers at month 12 (was ${num(r.mBase.endCust)})</span></div></div></div>
 <h3 style="margin-top:26px">How will you respond?</h3>
 <div class="opts" role="radiogroup" aria-label="Response options">${ev.opts.map((o,k)=>`<button class="opt" role="radio" aria-checked="${chosen===k}" data-act="pickOpt" data-k="${k}"><h3>${esc(o.n)}</h3><p>${esc(o.d)}</p></button>`).join('')}</div>
 <div class="row" style="margin-top:16px"><button class="btn pri" data-act="confirmOpt" ${chosen==null?'disabled':''}>${cr.confirmed?'Response locked in':'Lock in this response'}</button>${cr.confirmed?'<button class="btn sm" data-act="reconsider">Reconsider</button>':''}<button class="btn sm" data-act="nav" data-s="model">Back to model</button></div>
 ${cr.confirmed&&r.opt?outcome(r):''}
 <p class="disc">What would your team do differently, and why?</p>
 <label class="sr" for="notes">Team notes</label><textarea id="notes" class="inp auto" data-bind="crisis.notes" rows="3" placeholder="Capture your team’s discussion here (optional)">${esc(cr.notes)}</textarea>
 <div class="row" style="margin-top:18px"><button class="btn pri" data-act="crisisNext">Continue to your pitch</button></div></section>`};
function outcome(r){
 const d=r.mResp.yr1-r.mShock.yr1,rowc=(l,a,b,c,f=gbp)=>`<tr><td>${l}</td><td>${f(a)}</td><td>${f(b)}</td><td><b>${f(c)}</b></td></tr>`;
 const others=r.ev.opts.map((o,k)=>{const m=metrics(applyMods(state.fin,r.ev.impact(r.c),o.m(r.c)).fin);return `<li>${esc(o.n)}: ${gbp(m.yr1)}${k===state.crisis.opt?' (your choice)':''}</li>`}).join('');
 return `<div class="card" style="margin-top:20px"><h3>Consequences of: ${esc(r.opt.n)}</h3>
 <div class="tscroll"><table class="cmp"><thead><tr><th></th><th>Before the crisis</th><th>After the shock</th><th>After your response</th></tr></thead><tbody>
 ${rowc('Customers at month 12',r.mBase.endCust,r.mShock.endCust,r.mResp.endCust,v=>num(v))}${rowc('First-year revenue',r.mBase.rev12,r.mShock.rev12,r.mResp.rev12)}${rowc('First-year profit after setup',r.mBase.yr1,r.mShock.yr1,r.mResp.yr1)}${rowc('Gross margin',r.mBase.gm,r.mShock.gm,r.mResp.gm,v=>v==null?'n/a':num(v*100)+'%')}${rowc('Break-even customers',r.mBase.be,r.mShock.be,r.mResp.be,v=>v==null?'Not possible':num(v))}</tbody></table></div>
 <div class="two" style="margin-top:14px"><div class="note"><b>The trade-off.</b> ${esc(r.opt.t)}</div><div class="note"><b>Longer term.</b> ${esc(r.opt.lt)}</div></div>
 <p style="margin-top:12px">${d>=0?`In the simulation your response improves first-year profit by ${gbp(d)} compared with doing nothing.`:`On year-one numbers alone, doing nothing would have been ${gbp(-d)} better. Your response might still be right if it protects trust, control or future options. Is it worth the price?`}${r.cash>0?` You raise ${gbp(r.cash)} and give up ${r.eq}% of the company, leaving the founders with ${100-r.eq}% before any later rounds.`:r.eq>0?` Your founders give up ${r.eq}% equity in the process.`:''}${r.mResp.need>0?` Your cash still dips to ${gbp(-r.mResp.trough)}, so you would need funding to survive that period${r.cash>=r.mResp.need?' (your new funding covers it)':''}.`:''}</p>
 <details style="margin-top:12px"><summary>Compare year-one profit across all three options (for discussion)</summary><ul class="mut">${others}</ul><p class="hint">Year-one profit is only part of the picture. Reputation, ownership and risk matter too.</p></details></div>`}

function pitchData(){
 const i=state.idea,C=CH[state.ch]||CH.living,cn=state.concept||{},fin=finalFin(),m=metrics(fin),r=state.crisis.confirmed&&state.crisis.opt!=null?crisisResult():null;
 const name=i.name||'Untitled startup',tag=state.tagline||defaultTagline(),risk=(cn.risks||'').split('\n').filter(Boolean)[0]||C.risks[0];
 const f0=state.fin||MDEF[i.model],price={subscription:`${gbp(f0.price,2)} per customer per month`,payperuse:`About ${gbp(f0.price,2)} average monthly spend per active customer, charged per use`,commission:`About ${gbp(f0.price,2)} average monthly commission per active customer`,b2b:`${gbp(f0.price,2)} per organisation per month`,freemium:`Free core product. About ${gbp(f0.price,2)} blended monthly revenue per active user`}[i.model];
 const ask=m.need>0?Math.max(10000,Math.ceil(m.need*1.3/5000)*5000):0;
 const scenName=state.scen==='custom'?'custom':SC[state.scen].n.toLowerCase();
 const beS=m.be==null?'Under current assumptions the business does not break even, which is the first thing we would fix.':m.be===0?'We cover operating costs from the first customer.':`We break even at ${num(m.be)} customers${m.beMonth&&m.beMonth<=12?`, reached in month ${m.beMonth}`:m.beMonth?`, reached in month ${m.beMonth} (after year one)`:''}.`;
 const crisisS=r&&r.opt?`When “${r.ev.title.toLowerCase()}” hit, we chose to ${lc(r.opt.n)}. ${r.opt.t}`:'No crisis response has been recorded yet.';
 const invest=`${name} is building ${lc(i.solution)||'an AI-powered product'} for ${lc(i.customer)||'a clearly defined customer'}. We charge ${lc(price)}. In our ${scenName} simulation we reach ${num(m.endCust)} customers by month 12 and ${gbp(m.rev12)} of first-year revenue, with ${m.yr1>=0?`a first-year profit of ${gbp(m.yr1)}`:`a first-year loss of ${gbp(-m.yr1)}`} after setup costs. ${beS} ${r&&r.cash>0?`We have secured ${gbp(r.cash)} for ${r.eq}% of the company.`:ask?`We are seeking about ${gbp(ask)} to cover the cash we need while we grow.`:'We can fund growth from revenue in this scenario.'} Every figure here is an illustrative estimate from a classroom simulation.`;
 return{i,C,cn,fin,m,r,name,tag,risk,price,ask,beS,crisisS,invest,scenName}}

function showWinner(){const w=ranking()[0];if(!w)return;modal(`<div class="winner">${logo(w.startup||w.name,120)}<p class="mut">The winner is</p><h2>${esc(w.name)}</h2>${w.startup?`<p style="font-size:1.2rem">${esc(w.startup)}</p>`:''}${w.tag?`<p class="pos">${esc(w.tag)}</p>`:''}<p class="total tn">${num(total(w),1)} / 100</p><p class="hint">Weighted judge score${vsum(w)?` · ${vsum(w)} audience votes`:''}</p><button class="btn pri" data-act="mclose" data-focus>Close</button></div>`)}

/* ============ host panel & timer ============ */
const fmtT=s=>{s=Math.max(0,s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
function renderTimer(){const t=state.host,el=$('#timer');$('#tVal').textContent=fmtT(t.remaining);$('#tState').textContent=t.running?'Running':t.remaining===0?'Time’s up':t.remaining===t.duration?'Ready':'Paused';el.classList.toggle('warn',t.running&&t.remaining<=60&&t.remaining>0);el.classList.toggle('zero',t.remaining===0);const d=$('#dtime');if(d)d.textContent=fmtT(t.remaining);const b=$('#tgl');if(b)b.textContent=t.running?'Pause':t.remaining===0?'Restart':'Start'}
function beep(){try{const A=window.AudioContext||window.webkitAudioContext,a=new A(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=660;g.gain.value=.08;o.start();setTimeout(()=>o.frequency.value=880,220);setTimeout(()=>{o.stop();a.close()},520)}catch(e){}}
setInterval(()=>{const t=state.host;if(t.running){t.remaining=Math.max(0,Math.round((t.endAt-Date.now())/1000));if(t.remaining===0){t.running=false;save();beep();toast('Time is up.')}renderTimer()}},250);
const timerToggle=()=>{const t=state.host;if(t.running){t.running=false}else{if(t.remaining<=0)t.remaining=t.duration;t.endAt=Date.now()+t.remaining*1000;t.running=true}save();renderTimer()};
function renderHost(){const h=state.host,cur=SCR.indexOf(state.screen);
 $('#host').innerHTML=`<div class="fh"><h3 style="font-size:1.3rem;color:var(--tx)">Host controls</h3><button class="btn sm" data-act="host" aria-label="Close host controls">Close</button></div>
 <section><h3>Round timer</h3><div class="dtime" id="dtime" aria-hidden="true">${fmtT(h.remaining)}</div><div class="row" style="margin:10px 0"><button class="btn pri" id="tgl" data-act="tToggle">${h.running?'Pause':'Start'}</button><button class="btn" data-act="tReset">Reset</button></div>
  <div class="seg" role="group" aria-label="Round duration">${[5,10,15,20,30,45].map(m=>`<button class="${h.duration===m*60?'on':''}" data-act="tDur" data-m="${m}" style="min-width:52px">${m}m</button>`).join('')}</div>
  <form class="row" data-form="customDur" style="margin-top:8px"><label class="sr" for="cdur">Custom minutes</label><input id="cdur" class="inp" type="number" min="1" max="180" style="width:120px" placeholder="Minutes"><button class="btn sm" type="submit">Set</button></form><p class="hint" style="margin-top:6px">Works offline. Also keeps running if you switch screens.</p></section>
 <section><h3>Stages</h3><p class="hint">Current: ${cur===0?'Welcome':cur===6?'Judging':LAB[cur-1]}</p><div class="row" style="margin-top:8px"><button class="btn sm" data-act="hPrev" ${cur<=0?'disabled':''}>Previous stage</button><button class="btn sm pri" data-act="hNext" ${cur>=6?'disabled':''}>Reveal next stage</button></div></section>
 <section><h3>Crisis</h3><label class="lb" for="hc" style="font-weight:500">Choose a crisis</label><select id="hc" class="inp">${CRISES.map(c=>`<option value="${c.id}" ${(h.fair||state.crisis.id)===c.id?'selected':''}>${esc(c.title)}</option>`).join('')}</select>
  <div class="row" style="margin-top:8px"><button class="btn sm" data-act="hCrisisRand">Trigger a random crisis</button><button class="btn sm" data-act="hCrisisSel">Trigger selected</button></div>
  <div class="row" style="margin-top:8px"><button class="btn sm acc" data-act="hFair">Reveal selected to all teams</button>${h.fair?'<button class="btn sm" data-act="hFairOff">Clear fair mode</button>':''}</div>
  <p class="hint" style="margin-top:6px">${h.fair?`Fair mode on: every team gets “${esc(EV(h.fair).title)}”.`:'Fair mode off: each team gets a random crisis.'}</p></section>
 <section><h3>Discussion prompts</h3><p id="hp" style="margin-bottom:8px">${esc(PROMPTS[h.pIdx%PROMPTS.length])}</p><div class="row"><button class="btn sm" data-act="pNext">Next prompt</button><button class="btn sm acc" data-act="pShow">Show on screen</button><button class="btn sm" data-act="pHide">Hide</button></div></section>
 <section><h3>Judging</h3><button class="btn sm" data-act="hJudge">Open judging mode</button></section>
 <section><h3>Reset</h3><div class="row"><button class="btn sm danger" data-act="nextGroup">Reset for next group</button><button class="btn sm danger" data-act="resetAsk">Reset everything</button></div><p class="hint" style="margin-top:6px">“Next group” keeps all teams and scores for judging.</p></section>`}
function toggleHost(open){const d=$('#host'),o=open===undefined?!d.classList.contains('open'):open;if(o)renderHost();d.classList.toggle('open',o);d.setAttribute('aria-hidden',!o);$('#hostBtn').setAttribute('aria-expanded',o);if(o)d.querySelector('button').focus();else $('#hostBtn').focus()}
function showPrompt(){const t=state.host.prompt;$('#bannerRoot').innerHTML=t?`<div class="banner" role="region" aria-label="Discussion prompt"><p>${esc(t)}</p><button class="btn sm" data-act="pHide">Dismiss</button></div>`:''}
function resetStudent(keepTeams=true){const teams=state.teams,host=state.host,last=state.team;state=dflt();state.host=host;if(keepTeams)state.teams=teams;if(!keepTeams)state.host=dflt().host;state.team={name:'',size:last.size};save();toggleHost(false);render();window.scrollTo({top:0})}

/* ============ events ============ */
const ACT={
 home:()=>go('welcome'),nav:el=>go(el.dataset.s),host:()=>toggleHost(),
 size:el=>{state.team.size=+el.dataset.v;$$('[data-act=size]').forEach(b=>{const on=+b.dataset.v===state.team.size;b.classList.toggle('on',on);b.setAttribute('aria-checked',on)});save()},
 pickCh:el=>{if(state.ch!==el.dataset.k){state.concept=null;state.fin=null;}state.ch=el.dataset.k;save();render()},
 randCh:async()=>{const keys=Object.keys(CH);let k;for(let n=0;n<9;n++){k=keys[n%6===0&&n>5?Math.floor(Math.random()*6):n%6];$$('.ccard').forEach(c=>c.classList.toggle('flash',c.dataset.k===k));await sleep(90)}k=rnd(keys);$$('.ccard').forEach(c=>c.classList.toggle('flash',c.dataset.k===k));await sleep(250);ACT.pickCh({dataset:{k}});toast(`Your team’s challenge: ${CH[k].n}`)},
 chNext:()=>{if(!state.ch){$('#e-ch').textContent='Choose a challenge, or pick one at random, to continue.';return}go('build')},
 brain:el=>{const f=el.dataset.f,box=$('#br-'+f);if(box.children.length){box.innerHTML='';return}box.innerHTML=brainSet(f).slice(0,f==='name'?6:4).map(t=>`<button type="button" class="sug" data-act="useSug" data-f="${f}" data-v="${esc(t)}">${esc(t)}</button>`).join('')},
 useSug:el=>{const f=el.dataset.f,inp=$('#f-'+f);inp.value=el.dataset.v;state.idea[f]=el.dataset.v;$('#br-'+f).innerHTML='';if(inp.tagName==='TEXTAREA')autosize(inp);inp.focus();saveSoon();renderCof()},
 model:el=>{state.idea.model=el.dataset.k;$$('.mopt').forEach(b=>b.setAttribute('aria-checked',b.dataset.k===state.idea.model));save();renderCof()},
 surprise:()=>{if(!state.ch)state.ch=rnd(Object.keys(CH));const b=rnd(CH[state.ch].ideas);state.idea={name:rnd(b.names),problem:b.problem,customer:b.customer,solution:b.solution,diff:b.diff,model:b.model};state.concept=null;state.fin=null;save();render();toast('Sample idea loaded. Edit anything you like.')},
 editIdea:()=>{const f=$('#f-name');f.scrollIntoView({behavior:'smooth',block:'center'});f.focus()},
 regen:()=>runGen(),
 buildNext:()=>{if(!validateIdea())return;const go2=()=>go('model');if(!state.concept)runGen(go2);else go2()},
 resetFin:()=>{state.baseFin={...MDEF[state.idea.model]};state.fin={...state.baseFin};state.scen='base';save();syncInputs();updateModel();toast('Assumptions reset to defaults.')},
 scen:el=>{const k=el.dataset.k;state.scen=k;state.fin=k==='base'?{...state.baseFin}:scenFin(state.baseFin,k);save();$$('[data-fin]').forEach(i=>i.value=Math.round(state.fin[i.dataset.fin]*100)/100);updateModel()},
 challengeModel:showCritique,
 fix:el=>{const x=lastCrit[+el.dataset.i];if(!x||!x.fix)return;Object.assign(state.fin,x.fix.patch);if(state.scen==='base')Object.assign(state.baseFin,x.fix.patch);else state.scen='custom';save();syncInputs();updateModel();showCritique();toast('Suggestion applied. Compare the results above.')},
 modelNext:()=>go('crisis'),
 reveal:()=>{state.crisis.revealed=true;save();render()},
 pickOpt:el=>{state.crisis.opt=+el.dataset.k;state.crisis.confirmed=false;save();render()},
 confirmOpt:()=>{if(state.crisis.opt==null)return;state.crisis.confirmed=true;syncTeam();save();render();const o=$('.card h3[style]');setTimeout(()=>{const c=$$('.card').find(x=>/Consequences of/.test(x.textContent));c&&c.scrollIntoView({behavior:'smooth',block:'start'})},50)},
 reconsider:()=>{state.crisis.confirmed=false;save();render()},
 crisisNext:()=>{if(!state.crisis.confirmed){toast('Lock in a response before pitching, or continue anyway after choosing one.');return}go('pitch')},
 copy:()=>copyText(pitchText()).then(()=>toast('Pitch copied to clipboard.')).catch(()=>toast('Copy failed. Select the text manually.')),
 print:()=>{try{window.print()}catch(e){toast('Use Ctrl/Cmd+P to print or save as PDF.')}},
 fs:()=>{const d=$('#pdoc');try{d.requestFullscreen?d.requestFullscreen():toast('Full screen is not supported here.')}catch(e){toast('Full screen is not available here.')}},
 toVote:()=>go('vote'),
 vtab:el=>{vtab=el.dataset.k;render()},
 vote:el=>{const t=state.teams.find(x=>x.id===el.dataset.id);if(!t)return;t.votes[el.dataset.k]=Math.max(0,t.votes[el.dataset.k]+ +el.dataset.d);save();render()},
 delTeam:el=>{const t=state.teams.find(x=>x.id===el.dataset.id);confirmBox('Remove this team?',`${t?t.name:'This team'} and its scores will be removed from judging.`,'Remove team',()=>{state.teams=state.teams.filter(x=>x.id!==el.dataset.id);if(state.teamId===el.dataset.id)state.teamId=null;save();render()})},
 winner:showWinner,
 mclose:closeModal,'mclose-bg':(el,e)=>{if(e.target===el)closeModal()},mok:()=>{const f=confirmBox.fn;closeModal();f&&f()},
 resetAsk:()=>confirmBox('Start over?','This clears the current team’s progress and all saved teams and scores on this browser. This cannot be undone.','Yes, reset everything',()=>resetStudent(false)),
 nextGroup:()=>confirmBox('Reset for the next group?','The current team’s progress is cleared. Teams and judging scores are kept so you can compare them later.','Reset for next group',()=>{syncTeam();save();resetStudent(true);toast('Ready for the next group.')}),
 tToggle:timerToggle,tReset:()=>{const t=state.host;t.running=false;t.remaining=t.duration;save();renderTimer()},
 tDur:el=>{const t=state.host;t.duration=+el.dataset.m*60;t.running=false;t.remaining=t.duration;save();renderHost()},
 hNext:()=>{const i=SCR.indexOf(state.screen);if(i<6){state.reached=Math.max(state.reached,i+1);go(SCR[i+1],true)}toggleHost(false)},
 hPrev:()=>{const i=SCR.indexOf(state.screen);if(i>0)go(SCR[i-1],true);toggleHost(false)},
 hCrisisRand:()=>{if(!state.fin)ensureFin();assignCrisis();state.crisis.revealed=false;state.reached=Math.max(state.reached,4);go('crisis',true);toggleHost(false);toast('A new crisis has been triggered.')},
 hCrisisSel:()=>{ensureFin();assignCrisis($('#hc').value);state.reached=Math.max(state.reached,4);go('crisis',true);toggleHost(false)},
 hFair:()=>{state.host.fair=$('#hc').value;ensureFin();assignCrisis(state.host.fair);save();renderHost();toast('Fair mode on: all teams will face the same crisis.')},
 hFairOff:()=>{state.host.fair=null;save();renderHost()},
 pNext:()=>{state.host.pIdx=(state.host.pIdx+1)%PROMPTS.length;save();$('#hp').textContent=PROMPTS[state.host.pIdx]},
 pShow:()=>{state.host.prompt=PROMPTS[state.host.pIdx%PROMPTS.length];save();showPrompt()},
 pHide:()=>{state.host.prompt=null;save();showPrompt()},
 hJudge:()=>{vtab='score';go('vote',true);toggleHost(false)}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b,e)});
const FORMS={
 start:()=>{const n=low(state.team.name),err=$('#e-team'),inp=$('#teamName');if(n.length<2){err.textContent='Enter a team name (at least 2 characters) to start.';inp.setAttribute('aria-invalid','true');inp.focus();return}inp.setAttribute('aria-invalid','false');err.textContent='';state.team.name=n;let t=curTeam();if(!t){t=newTeam(n);state.teams.push(t);state.teamId=t.id}t.name=n;save();go(state.last&&state.last!=='welcome'?state.last:'challenge')},
 gen:()=>runGen(),
 addTeam:f=>{const i=$('#newTeam'),n=low(i.value);if(n.length<2){toast('Enter a team name.');return}state.teams.push(newTeam(n));save();render()},
 ballot:()=>{let n=0;CATS.forEach(([k])=>{const id=$('#b-'+k).value,t=state.teams.find(x=>x.id===id);if(t){t.votes[k]++;n++}});if(!n){toast('Choose at least one team to vote for.');return}save();render();toast('Ballot recorded. Pass the device to the next voter.')},
 customDur:()=>{const v=Math.round(+$('#cdur').value);if(!(v>=1&&v<=180)){toast('Enter between 1 and 180 minutes.');return}const t=state.host;t.duration=v*60;t.remaining=t.duration;t.running=false;save();renderHost()}
};
document.addEventListener('submit',e=>{e.preventDefault();const f=FORMS[e.target.dataset.form];if(f)f(e.target)});
document.addEventListener('input',e=>{const t=e.target;
 if(t.dataset.bind){setPath(t.dataset.bind,t.value);if(t.tagName==='TEXTAREA')autosize(t);if(t.dataset.bind==='idea.name'||t.dataset.bind==='team.name'||t.dataset.bind==='tagline')syncTeam();saveSoon();if(t.dataset.bind.startsWith('idea.')&&state.concept&&!t.closest('#cof')){const n=$('#cof .note.warn');if(!n&&state.concept.sig!==sig(state.idea,state.ch))renderCof()}return}
 if(t.dataset.fin){const k=t.dataset.fin;let v=parseFloat(t.value);if(!isFinite(v)||v<0)v=0;if(k==='growth'||k==='churn')v=Math.min(v,100);state.fin[k]=v;if(state.scen==='base')state.baseFin[k]=v;else if(state.scen!=='custom')state.scen='custom';$$(`[data-fin="${k}"]`).forEach(o=>{if(o!==t)o.value=v});saveSoon();updateModel();return}
 if(t.dataset.score){const[id,k]=t.dataset.score.split('|'),tm=state.teams.find(x=>x.id===id);if(!tm)return;tm.scores[k]=+t.value;$(`#v-${id}-${k}`).textContent=t.value;$(`#tot-${id}`).textContent=num(total(tm),1)+' / 100';saveSoon()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('.modal-bg'))closeModal();else if($('#host').classList.contains('open'))toggleHost(false)}
 if(e.altKey&&e.key.toLowerCase()==='h'){e.preventDefault();toggleHost()}});
document.addEventListener('change',e=>{if(e.target.dataset&&e.target.dataset.bind&&e.target.dataset.bind.startsWith('idea.')){saveSoon()}});

/* ============ init ============ */
(function init(){
 const t=state.host;if(t.running){t.remaining=Math.max(0,Math.round((t.endAt-Date.now())/1000));if(t.remaining===0)t.running=false}
 if(!SCR.includes(state.screen))state.screen='welcome';
 if(['model','crisis','pitch'].includes(state.screen)){if(!state.fin)ensureFin()}
 render();renderTimer();showPrompt()})();
})();
</script>
</body>
</html>
